# LiteLLM Proxy Configuration for llama.cpp GLM backend — with XML transform proxy.
#
# Architecture:
#   VS Code / GitHub Copilot plugin -> LiteLLM (12111) -> XML proxy (12180) -> llama-server (12112)
#
# The XML proxy (server_compress_llamacpp_direct.py, runs on port 12180) does:
#   1. Renders all client-provided tools into XML prompt instructions
#   2. Removes native OpenAI tool schemas before llama.cpp sees them
#   3. Fixes GBNF grammar escapes (\d \w \s etc) in forwarded payloads
#   4. Converts GLM XML <tool_call> output to OpenAI JSON tool_calls
#   5. Also accepts direct leaked tool tags like <runSubagent> when that tool was provided
#
# LiteLLM here acts as a passthrough — it just forwards requests to the XML proxy.
# No custom LiteLLM callbacks needed; all logic lives in the XML proxy.

model_list:
  - model_name: glm-4.7-flash-llamacpp
    litellm_params:
      model: openai/glm-4.7-flash-llamacpp
      api_base: http://localhost:12180/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
      top_p: 0.95
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      context_window: 202752

  - model_name: glm47flash-llamacpp
    litellm_params:
      model: openai/glm-4.7-flash-llamacpp
      api_base: http://localhost:12180/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
      top_p: 0.95
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      context_window: 202752

litellm_settings:
  drop_params: true
  request_timeout: 600
  set_verbose: false
  json_logs: false
  max_parallel_requests: 1

general_settings:
  completion_model: "glm-4.7-flash-llamacpp"
