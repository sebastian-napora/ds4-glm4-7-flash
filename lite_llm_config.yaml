# LiteLLM Proxy Configuration for GLM-4.7-Flash custom native backend
#
# Architecture:
#   VS Code / GitHub Copilot plugin -> LiteLLM (11111) -> glm-native-server (11112)

model_list:
  - model_name: glm-4.7-flash-gguf
    litellm_params:
      model: openai/glm-4.7-flash-native
      api_base: http://localhost:11112/v1
      api_key: none
      max_tokens: 60000
      temperature: 1.0
      top_p: 0.95
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      context_window: 202752

  - model_name: glm47flash
    litellm_params:
      model: openai/glm-4.7-flash-native
      api_base: http://localhost:11112/v1
      api_key: none
      max_tokens: 60000
      temperature: 1.0
      top_p: 0.95
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      context_window: 202752

litellm_settings:
  drop_params: true
  request_timeout: 600
  set_verbose: false
  json_logs: false
  max_parallel_requests: 1

general_settings:
  completion_model: "glm-4.7-flash-gguf"
  database_url: null
  store_model_in_db: false
